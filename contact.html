<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro V - Reservation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Bistro </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Reservation</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-padding">
        <section class="reservation-section">
            <h2>Book a Table</h2>
            <form action="#" method="POST" class="reservation-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8900" required>
                </div>

                <div class="form-group flex-group">
                    <div>
                        <label for="resDate">Date</label>
                        <input type="date" id="resDate" name="resDate" required>
                    </div>
                    <div>
                        <label for="guests">Number of Guests</label>
                        <input type="number" id="guests" name="guests" min="1" max="20" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="foodPref">Dietary Preference</label>
                    <select id="foodPref" name="foodPref">
                        <option value="none">No specific preference</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="vegan">Vegan</option>
                        <option value="gluten-free">Gluten-Free</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Special Requests</label>
                    <textarea id="message" name="message" rows="4" placeholder="Anniversary, birthday, allergies..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Confirm Reservation</button>
            </form>
        </section>

        
    </main>

     <footer>
        <div class="footer-content">
            <p>&copy; bistrov@gmail.com</p>
            <p>Contact us at info@bistrov.com</p>
            <p>1/398, Rajiv Gandhi Salai, Navallur, Chennai</p>
        </div>
</footer>
</body>
</html>
